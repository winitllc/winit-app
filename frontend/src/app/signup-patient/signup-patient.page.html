<ion-content [fullscreen]="true">
  <ion-row>
    <ion-col class="default-padding">
      <img src="../../assets/winit-bg.png" />
    </ion-col>
  </ion-row>
  <ion-grid>
    <ion-row class="input-name">
      <ion-col size="12">
        <ion-label> First Name </ion-label>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12">
        <ion-item class="custom-item">
          <ion-input placeholder="First Name" [(ngModel)]="userData.firstName">
            <ion-icon slot="start" name="person-outline"></ion-icon>
          </ion-input>
        </ion-item>
      </ion-col>
    </ion-row>
    <ion-row class="input-field">
      <ion-col size="12">
        <ion-label> Last Name </ion-label>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12">
        <ion-item class="custom-item">
          <ion-input placeholder="Last Name" [(ngModel)]="userData.lastName">
            <ion-icon slot="start" name="person-outline"></ion-icon>
          </ion-input>
        </ion-item>
      </ion-col>
    </ion-row>

    <ion-row class="input-field">
      <ion-col size="12">
        <ion-label> Email </ion-label>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12">
        <ion-item class="custom-item">
          <ion-input
            type="email"
            placeholder="Email"
            [(ngModel)]="userData.email"
          >
            <ion-icon slot="start" name="mail-outline"></ion-icon>
          </ion-input>
        </ion-item>
      </ion-col>
    </ion-row>

    <ion-row class="input-field">
      <ion-col size="12">
        <ion-label> Confirm Email </ion-label>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12">
        <ion-item class="custom-item">
          <ion-input
            type="email"
            placeholder="Confirm Email"
            [(ngModel)]="userData.confirmEmail"
          >
            <ion-icon slot="start" name="mail-outline"></ion-icon>
          </ion-input>
        </ion-item>
      </ion-col>
    </ion-row>

    <ion-row class="input-field">
      <ion-col size="12">
        <ion-label>Password</ion-label>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12">
        <ion-item class="custom-item">
          <ion-input
            type="Password"
            placeholder="Password"
            [(ngModel)]="userData.newPassword"
          >
            <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
          </ion-input>
        </ion-item>
      </ion-col>
    </ion-row>

    <ion-row class="signIn-btn">
      <ion-col size="12">
        <ion-button (click)="registerPatientAction()">
          <ion-label>Sign up</ion-label>
        </ion-button>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col class="create-account">
        <ion-label class="create-account-label">
          Already have an account?
          <span (click)="goBack()">Login</span>
        </ion-label>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
