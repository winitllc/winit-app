<ion-content [fullscreen]="true" class="auth-content">
  <div class="auth-screen">
    <div class="auth-hero">
      <img src="../../assets/icon-only.png" class="auth-logo" alt="WINIT" />
      <h1 class="auth-title">Create account</h1>
      <p class="auth-sub">Join WINIT to scan and check products</p>
    </div>

    <div class="auth-form">
      <div class="field-row">
        <div class="field-group">
          <label class="field-label">First Name</label>
          <div class="field-wrap">
            <ion-icon name="person-outline" class="field-icon"></ion-icon>
            <input class="field-input" placeholder="First" [(ngModel)]="userData.firstName" />
          </div>
        </div>
        <div class="field-group">
          <label class="field-label">Last Name</label>
          <div class="field-wrap">
            <input class="field-input" placeholder="Last" [(ngModel)]="userData.lastName" />
          </div>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Email</label>
        <div class="field-wrap">
          <ion-icon name="mail-outline" class="field-icon"></ion-icon>
          <input type="email" class="field-input" placeholder="you@example.com" [(ngModel)]="userData.email" />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Confirm Email</label>
        <div class="field-wrap">
          <ion-icon name="mail-outline" class="field-icon"></ion-icon>
          <input type="email" class="field-input" placeholder="Confirm email" [(ngModel)]="userData.confirmEmail" />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Password</label>
        <div class="field-wrap">
          <ion-icon name="lock-closed-outline" class="field-icon"></ion-icon>
          <input type="password" class="field-input" placeholder="Create a password" [(ngModel)]="userData.newPassword" />
        </div>
      </div>

      <button class="primary-btn" (click)="registerPatientAction()">Create account</button>

      <p class="switch-link">
        Already have an account? <span (click)="goBack()">Sign in</span>
      </p>
    </div>
  </div>
</ion-content>
