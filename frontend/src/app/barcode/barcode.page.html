<ion-header>
  <ion-toolbar color="primary">
    <ion-title class="ion-text-center">
      Look up product
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <h2 class="ion-text-center"><img class="header-icon" src="assets/icon/favicon.png"> Scan Barcode</h2>
  <div class="scan-div">
    <button class="submit start-scan" ion-button (click)="scan()" [disabled]="!isSupported">
      <ion-icon color="primary" name="barcode"></ion-icon>
    </button>
    <p *ngIf="!isSupported" class="ion-text-center ion-padding">
      Barcode scanning is only available on the native mobile app.
    </p>
  </div>
</ion-content>
