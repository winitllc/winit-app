<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Search Products</ion-title>
    <ion-buttons slot="end">
      <ion-button color="light" (click)="cancel()">Cancel</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-searchbar
    [(ngModel)]="searchInput"
    (ionInput)="filterList()"
    placeholder="Filter categories…"
    debounce="150"
    class="category-search">
  </ion-searchbar>

  <ion-list lines="full">
    <ion-item *ngFor="let entry of visibleCategories" button detail="false" (click)="search(entry)">
      <ion-label>{{entry.displayName}}</ion-label>
      <ion-icon slot="end" name="chevron-forward-outline" color="medium"></ion-icon>
    </ion-item>
  </ion-list>

  <div *ngIf="visibleCategories.length === 0" class="ion-text-center ion-padding">
    <p>No categories match "{{searchInput}}"</p>
  </div>
</ion-content>
