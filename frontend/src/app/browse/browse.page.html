<ion-header>
  <ion-toolbar color="primary">
    <ion-title class="ion-text-center">Browse</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="searchProductModal()">
        <ion-icon slot="icon-only" name="search" color="light"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="browse-header">
    <h2><img class="header-icon" src="assets/icon/favicon.png"> Explore Products</h2>
  </div>

  <ion-grid class="category-grid">
    <ion-row>
      <ion-col size="6" *ngFor="let cat of categories">
        <div class="category-tile" (click)="browseProducts(cat.slug, cat.display_name)">
          <img [src]="cat.image_url" [alt]="cat.display_name" loading="lazy" (error)="$any($event.target).src='assets/imgs/noProduct.png'">
          <div class="category-label">{{cat.display_name}}</div>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
