<ion-content [fullscreen]="true">
  <ion-row>
    <ion-col class="default-padding">
      <img src="../../assets/winit-bg.png" />
    </ion-col>
  </ion-row>

  <ion-grid *ngIf="!showForgotPassword">
    <ion-row class="input-email">
      <ion-col size="12">
        <ion-label>Email</ion-label>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12">
        <ion-item class="custom-item">
          <ion-input type="email" placeholder="Email" [(ngModel)]="userData.email">
            <ion-icon slot="start" name="mail-outline"></ion-icon>
          </ion-input>
        </ion-item>
      </ion-col>
    </ion-row>

    <ion-row class="input-password">
      <ion-col size="12">
        <ion-label>Password</ion-label>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12">
        <ion-item class="custom-item">
          <ion-input type="password" placeholder="Password" [(ngModel)]="userData.password">
            <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
          </ion-input>
        </ion-item>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col class="forgot-password">
        <ion-label (click)="showForgotPassword = true; forgotEmail = userData.email">Forgot password?</ion-label>
      </ion-col>
    </ion-row>

    <ion-row class="signIn-btn">
      <ion-col size="12">
        <ion-button (click)="loginAction()">
          <ion-label>Sign in</ion-label>
        </ion-button>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col class="create-account">
        <ion-label class="create-account-label">
          New to WINIT?
          <span (click)="registerAction()">Create an account</span>
        </ion-label>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col class="create-account">
        <ion-label (click)="registerActionHealthPro()" class="health-pro-label">
          Sign up as health pro
        </ion-label>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Forgot Password panel -->
  <ion-grid *ngIf="showForgotPassword">
    <ion-row>
      <ion-col size="12">
        <ion-label class="section-title">Reset Password</ion-label>
        <p class="section-sub">Enter your email and we'll send you a reset link.</p>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12">
        <ion-item class="custom-item">
          <ion-input type="email" placeholder="Your email" [(ngModel)]="forgotEmail">
            <ion-icon slot="start" name="mail-outline"></ion-icon>
          </ion-input>
        </ion-item>
      </ion-col>
    </ion-row>

    <ion-row class="signIn-btn">
      <ion-col size="12">
        <ion-button (click)="forgotPasswordAction()">
          <ion-label>Send Reset Link</ion-label>
        </ion-button>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col class="create-account">
        <ion-label class="create-account-label">
          <span (click)="showForgotPassword = false">Back to Sign in</span>
        </ion-label>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
