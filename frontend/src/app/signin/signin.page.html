<ion-content [fullscreen]="true" class="auth-content">

  <!-- Sign In form -->
  <div class="auth-screen" *ngIf="!showForgotPassword">
    <div class="auth-hero">
      <img src="../../assets/icon-only.png" class="auth-logo" alt="WINIT" />
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Sign in to your WINIT account</p>
    </div>

    <div class="auth-form">
      <div class="field-group">
        <label class="field-label">Email</label>
        <div class="field-wrap">
          <ion-icon name="mail-outline" class="field-icon"></ion-icon>
          <input type="email" class="field-input" placeholder="you@example.com" [(ngModel)]="userData.email" />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Password</label>
        <div class="field-wrap">
          <ion-icon name="lock-closed-outline" class="field-icon"></ion-icon>
          <input type="password" class="field-input" placeholder="Your password" [(ngModel)]="userData.password" />
        </div>
      </div>

      <button class="link-btn" (click)="showForgotPassword = true; forgotEmail = userData.email">
        Forgot password?
      </button>

      <button class="primary-btn" (click)="loginAction()">Sign in</button>

      <p class="switch-link">
        New to WINIT? <span (click)="registerAction()">Create an account</span>
      </p>
    </div>
  </div>

  <!-- Forgot Password panel -->
  <div class="auth-screen" *ngIf="showForgotPassword">
    <div class="auth-hero">
      <div class="back-icon-wrap">
        <ion-icon name="arrow-back-outline" class="back-icon" (click)="showForgotPassword = false"></ion-icon>
      </div>
      <h1 class="auth-title">Reset password</h1>
      <p class="auth-sub">We'll send a reset link to your email</p>
    </div>

    <div class="auth-form">
      <div class="field-group">
        <label class="field-label">Email</label>
        <div class="field-wrap">
          <ion-icon name="mail-outline" class="field-icon"></ion-icon>
          <input type="email" class="field-input" placeholder="you@example.com" [(ngModel)]="forgotEmail" />
        </div>
      </div>

      <button class="primary-btn" (click)="forgotPasswordAction()">Send Reset Link</button>

      <p class="switch-link">
        <span (click)="showForgotPassword = false">Back to Sign in</span>
      </p>
    </div>
  </div>

</ion-content>
